name: Check and deploy marketing site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  homepage-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and test production homepage
        run: npm run test:e2e
      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Preserve tested build for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: marketing-site
          path: dist/
          if-no-files-found: error

  deploy-to-simply:
    needs: homepage-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      -   name: Download tested production build
          uses: actions/download-artifact@v4
          with:
            name: marketing-site
            path: dist/

      - name: Upload new frontend
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.SIMPLY_SSH_HOST }}
          username: ${{ vars.SIMPLY_SSH_USERNAME }}
          key: ${{ secrets.SIMPLY_SSH_KEY }}
          port: 22
          source: "dist"
          target: /var/www/nembadminton.dk/projects/marketing-deploy/${{ github.sha }}
          strip_components: 1

      -   name: Switch to new version of marketing
          uses: appleboy/ssh-action@v1.0.0
          with:
            host: ${{ vars.SIMPLY_SSH_HOST }}
            username: ${{ vars.SIMPLY_SSH_USERNAME }}
            key: ${{ secrets.SIMPLY_SSH_KEY }}
            port: 22
            script: |
              ln -sfn /var/www/nembadminton.dk/projects/marketing-deploy/${{ github.sha }} /var/www/nembadminton.dk/public_html
