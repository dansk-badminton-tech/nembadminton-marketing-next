<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#eff6ff"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="85" fill="#2563eb" font-size="30" font-weight="700">Nembadminton</text>
    <text x="64" y="158" fill="#111827" font-size="42" font-weight="700">Sæt klubbens hold</text>
    <text x="64" y="215" fill="#111827" font-size="42" font-weight="700">med hjælp til regeltjek</text>
    <g fill="#fff" stroke="#bfdbfe" stroke-width="2">
      <rect x="64" y="272" width="330" height="145" rx="16"/>
      <rect x="434" y="272" width="330" height="145" rx="16"/>
      <rect x="804" y="272" width="330" height="145" rx="16"/>
    </g>
    <g fill="#2563eb" font-size="23" font-weight="700">
      <text x="88" y="310">1 · Afbud</text>
      <text x="458" y="310">2 · Holdene</text>
      <text x="828" y="310">3 · Deling</text>
    </g>
    <g fill="#111827" font-size="26">
      <text x="88" y="357">Få overblik</text><text x="88" y="392">over afbud</text>
      <text x="458" y="357">Sæt og kontrollér</text><text x="458" y="392">holdene</text>
      <text x="828" y="357">Del den officielle</text><text x="828" y="392">opstilling</text>
    </g>
    <text x="64" y="490" fill="#374151" font-size="25">Gratis og drevet på frivillig basis.</text>
    <text x="64" y="566" fill="#4b5563" font-size="21">Statisk illustration af forløbet · ikke et skærmbillede af appen</text>
  </g>
</svg>
